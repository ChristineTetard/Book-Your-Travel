<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Travel</title>

    <!-- lien Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- lien CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- lien Font Awsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/icônes/Favicon BYT.png" />
</head>

<body>

    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">

                <!-- Logo -->
                <img class="logo" src="assets/images/icônes/Favicon BYT.png" alt="Book Your Travel">

                <!-- Phone Number -->
                <div class="support-container">
                    <a class="phone-number" href="">
                        <i class="fa-solid fa-phone phone"></i>
                        <ul class="numéro">
                            <li class="support">24/7 Support number</li>
                            <li class="tel"><strong>1- 555 - 555 - 555</strong></li>
                        </ul>
                    </a>
                </div>

                <!-- Search Barre -->
                <form class="d-flex search-container" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search entire site here"
                        aria-label="Search" />
                    <button class="btn search-button" type="submit">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <circle cx="11" cy="11" r="7" stroke="#9a9a9a" stroke-width="2" fill="none" />
                            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="#9a9a9a" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </button>
                </form>

                <!-- Connexion -->
                <div class="compte-container">
                    <a class="connexion-home" href="">
                        <i class="fa-solid fa-circle-user compte"></i>
                        <p class="p-compte">My Account</p>
                    </a>
                </div>

                <!-- Langues -->
                <div class="container-langue">
                    <select class="langue" name="langues" id="langues">FR
                        <option value="fr" aria-label="Français">FR</option>
                        <option value="en" aria-label="Anglais">EN</option>
                    </select>
                    <!-- Devise -->
                    <select class="devise" name="devises" id="devises">FR
                        <option value="euro" aria-label="Euro">€</option>
                        <option value="livre" aria-label="Livre">£</option>
                    </select>
                </div>
            </div>
        </nav>

        <!-- Menu de naviguation -->

        <ul class="nav justify-content-center menu">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page hotel" href="#">HOTEL</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">FLIGHTS</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">FLIGHTS+HOTEL</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">SELF CATERING</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">CRUISES</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">CAR RENTAL</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">LOCATIONS</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">HOT DEALS</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">PAGES</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">CONTACT</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">BLOG</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">PURCHASE</a>
            </li>
        </ul>
    </header>

</body>

</html>
